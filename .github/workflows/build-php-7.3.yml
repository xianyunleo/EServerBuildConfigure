name: Build and Release PHP 7.3 (macOS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. php-7.3.33)"
        required: true
  push:
    tags:
      - 'php-7.3.*'

jobs:
  build_and_release:
    name: Build and Release PHP 7.3 (macOS)
    runs-on: macos-latest
    env:
      PREFIX: /Applications/EServer/childApp/php/php-7.3
      PHP_VERSION: 7.3.33
      MACOSX_DEPLOYMENT_TARGET: 11.0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install autoconf automake libtool bison re2c

      - name: Set Homebrew PATH
        run: |
          echo "bison version: $(bison --version | head -1)"
          BISON_PATH="$(brew --prefix bison)/bin"
          echo "bison path: $BISON_PATH"
          echo "$BISON_PATH" >> $GITHUB_PATH
          echo "new bison version: $($BISON_PATH/bison --version | head -1)"

      - name: Prepare EServer Library
        run: |
          sudo mkdir -p /Applications/EServer/Library
          sudo cp -R Library/* /Applications/EServer/Library/
          echo "===== /Applications/EServer/Library ====="
          ls -a /Applications/EServer/Library

      - name: Build PHP 7.3
        run: |
          chmod +x mac_arm64/php/php-7.3.sh
          ./mac_arm64/php/php-7.3.sh

      - name: Debug workspace
        run: |
          echo "===== PWD ====="
          pwd
          
          echo "===== ROOT LS ====="
          ls -la
          
          echo "===== FULL TREE ====="
          find . -maxdepth 3 -type f -print

      - name: Show PHP info
        run: |
          FILE="$PREFIX/bin/php"
          echo "=== PHP version ==="
          "$FILE" -v
          echo "=== PHP info (php -i) ==="
          "$FILE" -i
          echo "=== PHP modules ==="
          "$FILE" -m

      - name: Show file info
        run: |
          FILE="$PREFIX/bin/php"
          echo "=== file architectures ==="
          lipo -info "$FILE" 2>/dev/null || file "$FILE"
          echo "=== file minimum macOS version ==="
          otool -l "$FILE" | grep -A 3 LC_BUILD_VERSION
          echo "=== file dependencies ==="
          otool -L "$FILE"

      - name: Set artifact name
        run: echo "ARTIFACT_NAME=php-7.3.tar.xz" >> $GITHUB_ENV

      - name: Package artifact
        run: |
          tar -cJf "$ARTIFACT_NAME"  -C "$(dirname "$PREFIX")" "$(basename "$PREFIX")"

      - name: Collect build log on failure
        if: failure()
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          if [ -f "$LOG" ]; then
            {
              echo "## Build log (last 300 lines)"
              echo '```'
              tail -300 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 输出 error annotations（公开 API 可读，便于诊断）
            tail -c 4500 "$LOG" | fold -w 450 | head -10 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          else
            echo "::error::build.log not found"
          fi

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: ${{ env.ARTIFACT_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
