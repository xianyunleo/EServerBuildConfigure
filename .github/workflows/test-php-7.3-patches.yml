name: PHP 7.3 patch necessity test

# 临时诊断 workflow：逐个去掉某个补丁后编译 PHP 7.3，验证该补丁是否还必需。
# 触发：push tag php-7.3-patchtest*
# 不发布 release、不覆盖任何产物。

on:
  push:
    tags:
      - 'php-7.3-patchtest*'

jobs:
  test:
    name: without ${{ matrix.id }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 0001
            patch: 0001-Add-support-for-ICU-70.1-PHP7.3.patch
          - id: 0002
            patch: 0002-Add-minimal-OpenSSL-3.0-patch-PHP7.3.patch
          - id: 0003
            patch: 0003-Fix-bug-79589-ssl3_read_n-unexpected-eof-while-reading-PHP7.3.patch
          - id: 0006
            patch: 0006-Use-ITIMER_REAL-for-timeout-handling-PHP-7.3.patch
          - id: 0007
            patch: 0007-Fix-PEAR-installation-with-libxml2.13.patch
          - id: 0010
            patch: 0010-Fix-GH-16168-Fix-inline-assembly-labels-to-not-crash-PHP7.3.patch
    env:
      PREFIX: /Applications/EServer/childApp/php/php-7.3
      PHP_VERSION: 7.3.33
      MACOSX_DEPLOYMENT_TARGET: 11.0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install autoconf automake libtool bison re2c

      - name: Set Homebrew PATH
        run: |
          BISON_PATH="$(brew --prefix bison)/bin"
          echo "$BISON_PATH" >> $GITHUB_PATH

      - name: Prepare EServer Library
        run: |
          sudo mkdir -p /Applications/EServer/Library
          sudo cp -R Library/* /Applications/EServer/Library/

      - name: Drop patch ${{ matrix.id }} and build
        run: |
          P="${{ matrix.patch }}"
          echo "===== removing $P ====="
          sed -i '' "/$P/d" mac_arm64/php/php-7.3.sh
          echo "===== remaining patch lines ====="
          grep -n 'patch -p1 <' mac_arm64/php/php-7.3.sh
          chmod +x mac_arm64/php/php-7.3.sh
          ./mac_arm64/php/php-7.3.sh

      - name: Collect build log on failure
        if: failure()
        run: |
          CONFIG_LOG="build/php-$PHP_VERSION/config.log"
          MAKE_LOG="build/php-$PHP_VERSION/make.log"
          if [ -f "$MAKE_LOG" ]; then
            echo "===== make.log compile errors ====="
            grep -E 'error:|fatal error:|Undefined symbols|ld: ' "$MAKE_LOG" | grep -v 'ld: warning' | tail -30 || true
            ERRS=$(grep -A 4 -E 'Undefined symbols|error:|fatal error:' "$MAKE_LOG" | grep -vE 'warning|ld: warning' | tail -20 | base64 | tr -d '\n')
            echo "::error::MAKE_ERR_B64=$ERRS"
          else
            echo "make.log not found"
          fi
          if [ -f "$CONFIG_LOG" ]; then
            echo "::error::CONFIG_LOG_B64=$(tail -30 "$CONFIG_LOG" | base64 | tr -d '\n')"
          fi

      - name: Report success
        if: success()
        run: echo "::notice::BUILD_OK_WITHOUT ${{ matrix.id }} (${{ matrix.patch }})"
